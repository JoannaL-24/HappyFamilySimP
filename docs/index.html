<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Family Sim - Reset Password</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f4f4f9; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #45a049; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Reset Password</h2>
        <p>Please enter your new password below.</p>
        <input type="password" id="new-password" placeholder="New Password">
        <button onclick="updatePassword()">Update Password</button>
        <p id="message" style="margin-top: 15px; color: red;"></p>
    </div>

    <script>
        // 1. Declare the variable at the top (global scope)
    let supabaseClient;

    // 2. Initialize it as soon as the script loads
    const projectUrl = 'https://jpniuhsorgjkaqfxjgsr.supabase.co';
    const anonKey = 'sb_publishable_YbruDuYHSixswQSuRdsUSw_hQol-EZ6'; 

    supabaseClient = supabase.createClient(projectUrl, anonKey);

    // 3. Handle the code exchange when the window loads
    window.onload = async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');

        if (code) {
            try {
                const { data, error } = await supabaseClient.auth.exchangeCodeForSession(code);
                if (error) throw error;
                console.log("Session established successfully");
                // Clean the URL
                window.history.replaceState({}, document.title, window.location.pathname);
            } catch (err) {
                console.error("Error exchanging code:", err.message);
            }
        }
    };

    async function updatePassword() {
        const password = document.getElementById('new-password').value;
        const messageElement = document.getElementById('message');

        // Now supabaseClient is guaranteed to be defined
        const { error } = await supabaseClient.auth.updateUser({ password: password });

        if (error) {
            messageElement.style.color = "red";
            messageElement.innerText = "Error: " + error.message;
        } else {
            messageElement.style.color = "green";
            messageElement.innerText = "Password updated! You can now log in to the app.";
        }
    }
    </script>
</body>
</html>
