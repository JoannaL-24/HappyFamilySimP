name: happy_family_sim
description: "A family chore tracker with gamification - virtual creature care rewards for task completion."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  # flutter_riverpod: ^2.6.1
  # riverpod_annotation: ^2.6.1

  # Backend - Supabase
  # supabase_flutter: ^2.8.4
  supabase_flutter: ^2.0.0

  # Game engine
  flame: ^1.26.0

  # Routing
  go_router: ^15.1.2

  # Utilities
  flutter_dotenv: ^5.0.2
  logger: ^2.6.2
  fluttertoast: ^9.0.0
  image_picker: ^1.2.1
  # cached_network_image: ^3.4.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.0

  flutter_lints: ^6.0.0

  # Code generation for Riverpod
  # riverpod_generator: ^2.6.4
  # build_runner: ^2.4.15

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/images/Assets/
    - assets/images/Assets/Backgrounds/Classic/
    - assets/images/Assets/Backgrounds/XmasTheme/
    - assets/images/Assets/Cats/CatSprites/Classical/Individual/
